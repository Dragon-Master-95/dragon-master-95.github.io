<!-- CONTACT -->
<section id="contact">
  <div class="contact-bg-text">Contact</div>
  <div class="contact-inner">
    <p class="sec-label reveal">Get in Touch</p>
    <div class="contact-tagline reveal">{{ site.data.contact.tagline }}</div>
    <p class="contact-desc reveal">{{ site.data.contact.description }}</p>
    <div class="contact-emails reveal">
      {% for email in site.data.contact.emails %}
      <div class="contact-email-row" data-user="{{ email.user }}" data-domain="{{ email.domain }}">
        <!-- <a href="#" class="contact-email">{{ email.display }}</a> -->
        <button type="button" class="copy-btn">Copy</button>
      </div>
      {% endfor %}
    </div>
    <div class="social-row reveal">
      {% for social in site.data.contact.socials %}
      <a href="{{ social.href }}" target="_blank" class="social-link">{{ social.label }}</a>
      {% endfor %}
    </div>
  </div>
</section>
